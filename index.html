<style>
  :root{
    --bg:#F4F6F9;
    --bg-deep:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#EEF1F5;
    --border: rgba(30,41,59,0.12);
    --text:#1F2937;
    --muted:#6B7686;
    --accent:#E39A2D;
    --accent-deep:#C77F14;
    --accent-ink:#FFFFFF;
    --accent-soft:rgba(227,154,45,0.14);
    --good:#4FA377;
    --good-deep:#3A8560;
    --danger:#C65A4B;
    --radius:16px;
    --font-display:'Noto Serif KR', serif;
    --font-body:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(227,154,45,0.12), transparent 60%),
      linear-gradient(180deg, var(--bg-deep), var(--bg) 40%);
    color:var(--text);
    min-height:100vh;
    padding:32px 18px 80px;
  }
  .wrap{max-width:720px; margin:0 auto;}

  /* header */
  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.18em;
    color:var(--accent-deep);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:30px;
    margin:0 0 22px;
    letter-spacing:-0.01em;
  }
  .week-nav{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:999px;
    padding:6px 8px;
    width:fit-content;
    box-shadow:0 1px 2px rgba(30,41,59,0.05);
  }
  .week-nav button{
    background:none; border:none; color:var(--text);
    width:30px; height:30px; border-radius:50%;
    font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s;
  }
  .week-nav button:hover{background:var(--surface-2);}
  .week-label{
    font-family:var(--font-mono);
    font-size:13px;
    color:var(--text);
    min-width:150px;
    text-align:center;
  }
  .today-pill{
    font-family:var(--font-mono) !important;
    font-size:11px !important;
    width:auto !important;
    padding:0 12px;
    border-radius:999px !important;
    background:var(--surface-2) !important;
    color:var(--muted) !important;
  }
  .today-pill.is-current{ color:var(--accent-deep) !important; }

  /* member tabs */
  .members-row{
    display:flex; align-items:center; gap:8px;
    margin:26px 0 6px;
    overflow-x:auto;
    padding-bottom:6px;
  }
  .members-row::-webkit-scrollbar{height:4px;}
  .members-row::-webkit-scrollbar-thumb{background:var(--surface-2); border-radius:4px;}
  .member-pill{
    flex:0 0 auto;
    font-family:var(--font-body);
    font-size:13.5px;
    font-weight:600;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--muted);
    padding:9px 16px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s;
    display:inline-flex; align-items:center; gap:6px;
  }
  .member-pill.active{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--accent-ink);
  }
  .member-pill:hover:not(.active){border-color:rgba(30,41,59,0.28); color:var(--text);}
  .me-badge{
    font-size:10.5px; font-weight:700;
    background:var(--accent-soft); color:var(--accent-deep);
    padding:2px 7px; border-radius:999px;
  }
  .member-pill.active .me-badge{ background:rgba(255,255,255,0.28); color:#fff; }

  .delete-member{
    margin-left: 2px; font-size: 14px; font-weight: bold; color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; border-radius: 50%; transition: all .12s;
  }
  .delete-member:hover{ background: rgba(198,90,75,0.15); color: var(--danger); }
  .member-pill.active .delete-member{ color: rgba(255,255,255,0.8); }
  .member-pill.active .delete-member:hover{ background: rgba(0,0,0,0.15); color: #fff; }

  .add-member{
    flex:0 0 auto;
    font-family:var(--font-mono);
    font-size:13px;
    background:none;
    border:1px dashed rgba(30,41,59,0.3);
    color:var(--muted);
    padding:9px 14px;
    border-radius:999px;
    cursor:pointer;
  }
  .add-member:hover{color:var(--text); border-color:var(--muted);}

  .toolbar{
    display:flex; justify-content:space-between; align-items:center;
    margin:18px 0 6px; gap:10px;
  }
  .toolbar .name-edit{
    font-family:var(--font-display); font-size:19px; font-weight:600;
  }
  .toolbar-actions{ display:flex; gap:8px; }
  .ghost-btn{
    background:var(--surface); border:1px solid var(--border); color:var(--muted);
    font-family:var(--font-mono); font-size:11.5px; letter-spacing:0.04em;
    padding:7px 12px; border-radius:10px; cursor:pointer;
  }
  .ghost-btn:hover{color:var(--text); border-color:rgba(30,41,59,0.3);}
  .ghost-btn.on{ color:var(--accent-deep); border-color:var(--accent); background:var(--accent-soft); }

  .readonly-note{
    font-size:12.5px; color:var(--muted);
    background:var(--surface-2); border-radius:10px;
    padding:8px 12px; margin:0 0 12px;
  }
  .readonly-note button{
    background:none; border:none; padding:0; margin-left:4px;
    color:var(--accent-deep); font-weight:600; font-family:inherit; font-size:inherit;
    text-decoration:underline; cursor:pointer;
  }

  /* progress bar */
  .dawn-bar{
    height:5px; border-radius:4px; overflow:hidden;
    background:rgba(30,41,59,0.08);
    margin-bottom:4px;
  }
  .dawn-fill{
    height:100%;
    background:linear-gradient(90deg, var(--accent-deep), var(--accent));
    transition:width .4s ease;
  }

  /* item cards */
  .item-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px 18px 14px;
    margin-bottom:12px;
    box-shadow:0 1px 3px rgba(30,41,59,0.05);
  }
  .item-top{
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
    margin-bottom:12px;
  }
  .item-name{
    font-family:var(--font-display);
    font-weight:600;
    font-size:17px;
  }
  .item-goal{
    font-size:13px; color:var(--muted); margin-top:3px;
  }
  .item-name[contenteditable="true"], .item-goal[contenteditable="true"]{
    outline:1px dashed rgba(199,127,20,0.6); border-radius:4px; padding:1px 4px;
  }
  .item-meta{
    display:flex; align-items:center; gap:10px; flex-shrink:0;
  }
  .streak{
    font-family:var(--font-mono); font-size:12px; color:var(--accent-deep);
    background:var(--accent-soft); padding:3px 8px; border-radius:8px;
  }
  .delete-item{
    background:none; border:none; color:var(--muted); cursor:pointer; font-size:15px;
    width:24px; height:24px; border-radius:50%;
  }
  .delete-item:hover{color:var(--danger); background:rgba(198,90,75,0.12);}

  .days-row{ display:flex; gap:6px; }
  .day-cell{ flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; }
  .day-label{ font-family:var(--font-mono); font-size:10px; color:var(--muted); letter-spacing:0.04em; }
  .day-check{
    width:32px; height:32px; border-radius:9px;
    border:1.5px solid rgba(30,41,59,0.16);
    background:var(--surface-2);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all .12s;
  }
  .day-check svg{ opacity:0; transition:opacity .12s; width:15px; height:15px; }
  .day-check.checked{ background:var(--good); border-color:var(--good); }
  .day-check.checked svg{ opacity:1; }
  .day-check.future{ opacity:0.4; cursor:default; }
  .day-check.locked{ cursor:default; }
  .day-check:not(.checked):not(.future):not(.locked):hover{ border-color:var(--accent); }

  .add-item-row{
    display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;
  }
  .add-item-row input{
    flex:1; min-width:120px;
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    font-family:var(--font-body); font-size:13.5px;
    padding:10px 12px; border-radius:10px;
  }
  .add-item-row input:focus{ outline:none; border-color:var(--accent); }
  .add-item-row button{
    background:var(--accent); border:none; color:var(--accent-ink);
    font-weight:600; font-size:13px; font-family:var(--font-body);
    padding:0 16px; border-radius:10px; cursor:pointer;
  }

  .empty-state{
    text-align:center; padding:50px 20px; color:var(--muted);
    font-size:13.5px;
  }

  /* overview */
  .overview{
    margin-top:30px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px 18px 8px;
    box-shadow:0 1px 3px rgba(30,41,59,0.05);
  }
  .overview h2{
    font-family:var(--font-display); font-size:16px; font-weight:600; margin:0 0 14px;
  }
  .ov-row{
    display:flex; align-items:center; gap:12px;
    padding:9px 0; border-top:1px solid var(--border);
  }
  .ov-row:first-of-type{ border-top:none; }
  .ov-name-wrap{ width:96px; flex-shrink:0; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .ov-name{ font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ov-tag{ font-size:10.5px; color:var(--tier, var(--muted)); font-weight:600; white-space:nowrap; }
  .ov-streak{ font-size:10.5px; color:var(--accent-deep); font-weight:600; white-space:nowrap; }
  .ov-bar-wrap{ flex:1; }
  .ov-pct{ font-family:var(--font-mono); font-size:13px; font-weight:600; color:var(--tier, var(--muted)); width:42px; text-align:right; flex-shrink:0; }
  .ov-row.me{ background:var(--accent-soft); border-radius:12px; padding-left:10px; padding-right:10px; margin:0 -10px; border-top-color:transparent; }
  .ov-row .dawn-fill{ background:var(--tier, var(--accent)); }
  .ov-row.tier-4 .dawn-fill{ background:linear-gradient(90deg,#E8B400,#F5D04A); }
  .ov-row.tier-4 .ov-bar-wrap .dawn-bar{ box-shadow:0 0 0 2px rgba(232,180,0,0.28); }
  .tier-0{ --tier:#C65A4B; }
  .tier-1{ --tier:#D98A1F; }
  .tier-2{ --tier:#3E8FB0; }
  .tier-3{ --tier:#3A8560; }
  .tier-4{ --tier:#B98900; }
  .toast{
    position:fixed; left:50%; bottom:28px; transform:translate(-50%, 24px);
    background:var(--text); color:#fff;
    font-size:14px; font-weight:600;
    padding:12px 18px; border-radius:999px;
    box-shadow:0 10px 30px rgba(31,41,55,0.3);
    opacity:0; pointer-events:none; z-index:60;
    transition:opacity .25s, transform .25s;
    max-width:90vw; text-align:center;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }

  footer{
    max-width:720px; margin:34px auto 0; text-align:center;
    font-family:var(--font-mono); font-size:11px; color:var(--muted);
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .sync-dot{ width:6px; height:6px; border-radius:50%; background:var(--good); display:inline-block; }
  footer button{ background:none; border:none; color:var(--muted); text-decoration:underline; cursor:pointer; font-family:var(--font-mono); font-size:11px; }

  /* 이름 선택 모달 */
  .picker-overlay{
    position:fixed; inset:0; z-index:50;
    background:rgba(31,41,55,0.45);
    display:none; align-items:center; justify-content:center;
    padding:20px;
  }
  .picker-overlay.open{ display:flex; }
  .picker{
    background:var(--surface);
    border-radius:20px;
    padding:26px 22px 20px;
    width:100%; max-width:380px;
    box-shadow:0 20px 50px rgba(31,41,55,0.25);
  }
  .picker h3{
    font-family:var(--font-display); font-size:20px; font-weight:600; margin:0 0 6px;
  }
  .picker p{ margin:0 0 18px; font-size:13.5px; color:var(--muted); line-height:1.5; }
  .picker-list{
    display:grid; grid-template-columns:repeat(2, 1fr); gap:8px;
    max-height:50vh; overflow-y:auto;
  }
  .picker-list button{
    font-family:var(--font-body); font-size:14.5px; font-weight:600;
    background:var(--surface-2); color:var(--text);
    border:1px solid var(--border); border-radius:12px;
    padding:13px 10px; cursor:pointer;
    transition:all .12s;
  }
  .picker-list button:hover{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .picker-skip{
    display:block; margin:14px auto 0;
    background:none; border:none; color:var(--muted);
    font-family:var(--font-body); font-size:12.5px;
    text-decoration:underline; cursor:pointer;
  }

  @media (max-width:420px){
    .day-check{ width:28px; height:28px; }
    h1{font-size:25px;}
  }
</style>
</head>
<body>
<div class="wrap" id="mainContainer">
  <div class="eyebrow">SPIRITUAL TRAINING LOG</div>
  <h1>Daily Check Up</h1>
  <div class="week-nav">
    <button id="prevWeek" aria-label="이전 주">‹</button>
    <span class="week-label" id="weekLabel">-</span>
    <button id="nextWeek" aria-label="다음 주">›</button>
    <button class="today-pill" id="todayBtn">이번주</button>
  </div>

  <div class="members-row" id="memberTabs"></div>

  <div class="toolbar">
    <div class="name-edit" id="currentMemberLabel"></div>
    <div class="toolbar-actions">
      <button class="ghost-btn" id="switchUserBtn">내 이름 변경</button>
      <button class="ghost-btn" id="editToggle">편집</button>
    </div>
  </div>

  <div id="readonlyNote"></div>
  <div id="itemList"></div>

  <div class="overview" id="overview">
    <h2>이번 주 한눈에 보기</h2>
    <div id="overviewBody"></div>
  </div>
</div>

<footer>
  <span class="sync-dot"></span>
  <span id="syncLabel">연동 대기 중...</span>
  <button id="refreshBtn">서버 데이터 초기화</button>
</footer>

<div class="toast" id="toast"></div>

<div class="picker-overlay" id="pickerOverlay">
  <div class="picker" role="dialog" aria-labelledby="pickerTitle">
    <h3 id="pickerTitle">누구세요?</h3>
    <p>이름을 한 번만 고르면 이 기기에서는 다음부터 내 체크 화면이 바로 열려요.</p>
    <div class="picker-list" id="pickerList"></div>
    <button class="picker-skip" id="pickerSkip">나중에 고를래요</button>
  </div>
</div>

<script>
(function(){
  const firebaseConfig = {
    apiKey: "AIzaSyAZ03135Rjw9PwWEC5W2jVi7x4KeXFSQUQ",
    authDomain: "daily-check-up-d1a4f.firebaseapp.com",
    databaseURL: "https://daily-check-up-d1a4f-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "daily-check-up-d1a4f",
    storageBucket: "daily-check-up-d1a4f.firebasestorage.app",
    messagingSenderId: "145269594014",
    appId: "1:145269594014:web:6160991f41b8454a5fe88f",
    measurementId: "G-4D11RB78QQ"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const DAYS = [
    {key:'mon', label:'월'}, {key:'tue', label:'화'}, {key:'wed', label:'수'},
    {key:'thu', label:'목'}, {key:'fri', label:'금'}, {key:'sat', label:'토'}, {key:'sun', label:'일'}
  ];
  const CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

  const DEFAULT_MEMBERS = ['멤버1','멤버2','멤버3','멤버4','멤버5','멤버6'];
  const DEFAULT_ITEMS = [
    {name:'기도', goal:'매일 아침 10분 기도'},
    {name:'말씀 묵상', goal:'하루 한 장씩 읽기'},
    {name:'감사일기', goal:'감사한 일 3가지 적기'},
    {name:'절제 훈련', goal:'SNS 사용 줄이기'}
  ];

  const ME_KEY = 'dailyCheckUp.myName';

  let members = [];
  let items = {};
  let checks = {};
  let currentMember = null;
  let myName = null;
  let pickerSkipped = false;
  let weekOffset = 0;
  let editMode = false;
  let currentWeekRef = null;
  let allChecks = {};
  let prevMyTier = null;
  let prevMyWeek = null;
  let toastTimer = null;

  const TIERS = [
    {min:100, cls:'tier-4', label:'완주! 🏆'},
    {min:85,  cls:'tier-3', label:'거의 다 왔어요'},
    {min:60,  cls:'tier-2', label:'순항 중'},
    {min:30,  cls:'tier-1', label:'탄력 붙는 중'},
    {min:0,   cls:'tier-0', label:'이제 시작!'}
  ];
  const TIER_TOASTS = {
    1:'💪 30% 돌파! 탄력이 붙었어요',
    2:'🚀 60% 돌파! 순항 중이에요',
    3:'✨ 85% 돌파! 완주가 코앞이에요',
    4:'🏆 이번 주 100% 완주! 대단해요'
  };
  function tierOf(pct){ return TIERS.find(t => pct >= t.min); }
  function tierRank(pct){ return TIERS.length - 1 - TIERS.indexOf(tierOf(pct)); }

  function weekPct(name, weekChecks){
    const list = items[name] || [];
    if(!list.length) return null;
    let done = 0;
    list.forEach(it => {
      const c = (weekChecks || {})[it.id];
      if(c) DAYS.forEach(d => { if(c[d.key]) done++; });
    });
    return Math.round(done / (list.length * 7) * 100);
  }

  /* 80% 이상 달성한 주를 연속으로 센다 (진행 중인 이번 주는 달성했을 때만 더함) */
  function streakWeeks(name){
    const base = getMonday(new Date());
    let count = 0;
    const cur = weekPct(name, allChecks[isoDate(base)]);
    if(cur !== null && cur >= 80) count++;
    for(let i = 1; i <= 52; i++){
      const d = new Date(base); d.setDate(d.getDate() - 7 * i);
      const p = weekPct(name, allChecks[isoDate(d)]);
      if(p === null || p < 80) break;
      count++;
    }
    return count;
  }

  function showToast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
  }

  /* ---------- 내 이름 저장 (이 기기 브라우저에 기억) ---------- */
  function loadMyName(){
    try { return localStorage.getItem(ME_KEY) || null; } catch(e){ return null; }
  }
  function saveMyName(name){
    myName = name;
    try {
      if(name) localStorage.setItem(ME_KEY, name);
      else localStorage.removeItem(ME_KEY);
    } catch(e){}
  }
  myName = loadMyName();

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function uid(){ return 'i_' + Math.random().toString(36).slice(2,10); }

  function getMonday(d){
    const date = new Date(d);
    const day = date.getDay();
    const diff = (day === 0 ? -6 : 1) - day;
    date.setDate(date.getDate() + diff);
    date.setHours(0,0,0,0);
    return date;
  }
  function isoDate(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function currentWeekStart(){
    const base = getMonday(new Date());
    base.setDate(base.getDate() + weekOffset*7);
    return base;
  }
  function weekKey(){ return isoDate(currentWeekStart()); }
  function weekLabelText(){
    const start = currentWeekStart();
    const end = new Date(start); end.setDate(end.getDate()+6);
    const fmt = (d) => (d.getMonth()+1) + '/' + d.getDate();
    return fmt(start) + ' – ' + fmt(end) + (weekOffset===0 ? '  (이번주)' : '');
  }
  function isFutureDay(dayIndex){
    const start = currentWeekStart();
    const target = new Date(start); target.setDate(target.getDate() + dayIndex);
    const now = new Date(); now.setHours(0,0,0,0);
    return target > now;
  }

  /* 내 탭이거나 편집 모드일 때만 체크 가능 */
  function canCheck(){
    return editMode || (myName && currentMember === myName);
  }

  function initFirebaseSync(){
    db.ref('members').once('value').then(snap => {
      if(!snap.exists()){
        db.ref('members').set(DEFAULT_MEMBERS);
        const initialItems = {};
        DEFAULT_MEMBERS.forEach(m => {
          initialItems[m] = DEFAULT_ITEMS.map(d => ({id: uid(), name:d.name, goal:d.goal}));
        });
        db.ref('items').set(initialItems);
      }
    }).then(() => {
      db.ref('members').on('value', snap => {
        members = snap.val() || [];
        // 저장된 내 이름이 목록에서 사라졌다면 초기화
        if(myName && !members.includes(myName)){
          saveMyName(null);
          pickerSkipped = false;
        }
        if(!currentMember || !members.includes(currentMember)){
          currentMember = myName || members[0];
        }
        render();
      });

      db.ref('items').on('value', snap => {
        items = snap.val() || {};
        render();
      });

      db.ref('checks').on('value', snap => {
        allChecks = snap.val() || {};
        render();
      });

      updateWeekListener();
    });
  }

  function updateWeekListener() {
    if (currentWeekRef) currentWeekRef.off();
    currentWeekRef = db.ref('checks/' + weekKey());
    currentWeekRef.on('value', snap => {
      checks = snap.val() || {};
      render();
      setSync('실시간 동기화됨 · ' + new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'}));
    });
  }

  function getItemChecks(itemId){
    return checks[itemId] || {mon:false,tue:false,wed:false,thu:false,fri:false,sat:false,sun:false};
  }

  function completion(itemId){
    const c = getItemChecks(itemId);
    return DAYS.filter(d => c[d.key]).length;
  }

  function toggleDay(itemId, dayKey){
    if(!canCheck()) return;
    if(!checks[itemId]) checks[itemId] = {mon:false,tue:false,wed:false,thu:false,fri:false,sat:false,sun:false};
    checks[itemId][dayKey] = !checks[itemId][dayKey];
    db.ref('checks/' + weekKey() + '/' + itemId).set(checks[itemId]);
  }

  function addMember(){
    const name = prompt('새 멤버 이름을 입력해줘 (특수문자 금지)');
    if(!name || !name.trim()) return;
    const clean = name.trim().replace(/[\.\#\$\[\]\/]/g, "");
    if(!clean) return;
    if(members.includes(clean)){ currentMember = clean; render(); return; }
    members.push(clean);
    db.ref('members').set(members);
    db.ref('items/' + clean).set(DEFAULT_ITEMS.map(d => ({id: uid(), name:d.name, goal:d.goal})));
    currentMember = clean;
  }

  function renameMember(oldName){
    const name = prompt('이름 변경', oldName);
    if(!name || !name.trim() || name.trim() === oldName) return;
    const clean = name.trim().replace(/[\.\#\$\[\]\/]/g, "");
    if(!clean) return;

    members = members.map(m => m === oldName ? clean : m);
    db.ref('members').set(members);
    if(items[oldName]){
      db.ref('items/' + clean).set(items[oldName]);
      db.ref('items/' + oldName).remove();
    }
    if(currentMember === oldName) currentMember = clean;
    if(myName === oldName) saveMyName(clean);
  }

  function deleteMember(nameToDelete){
    if(members.length <= 1){
      alert('데이터 보호를 위해 최소 한 명의 멤버는 남겨두어야 해!');
      return;
    }
    if(confirm(`'${nameToDelete}' 멤버와 이 멤버의 모든 목표/체크 기록을 완전히 삭제할까?`)){
      members = members.filter(m => m !== nameToDelete);
      db.ref('members').set(members);
      db.ref('items/' + nameToDelete).remove();

      if(currentMember === nameToDelete){
        currentMember = myName && myName !== nameToDelete ? myName : members[0];
      }
    }
  }

  function addItem(name, goal){
    const list = items[currentMember] || [];
    list.push({id: uid(), name, goal});
    db.ref('items/' + currentMember).set(list);
  }

  function deleteItem(itemId){
    if(confirm('이 항목을 정말 삭제할까?')){
      const list = items[currentMember] || [];
      const updated = list.filter(it => it.id !== itemId);
      db.ref('items/' + currentMember).set(updated);
    }
  }

  function editItemField(itemId, field, value){
    const list = items[currentMember] || [];
    const it = list.find(i => i.id === itemId);
    if(it && it[field] !== value){
      it[field] = value;
      db.ref('items/' + currentMember).set(list);
    }
  }

  function setSync(label){
    document.getElementById('syncLabel').textContent = label;
  }

  /* ---------- 이름 선택 모달 ---------- */
  function renderPicker(){
    const overlay = document.getElementById('pickerOverlay');
    const shouldOpen = members.length > 0 && !myName && !pickerSkipped;
    overlay.classList.toggle('open', shouldOpen);
    if(!shouldOpen) return;

    const list = document.getElementById('pickerList');
    list.innerHTML = '';
    members.forEach(name => {
      const b = document.createElement('button');
      b.textContent = name;
      b.onclick = () => {
        saveMyName(name);
        currentMember = name;
        render();
      };
      list.appendChild(b);
    });
  }

  function openPicker(){
    pickerSkipped = false;
    saveMyName(null);
    render();
  }

  /* ---------- 렌더링 ---------- */
  function renderTabs(){
    const wrap = document.getElementById('memberTabs');
    wrap.innerHTML = '';
    members.forEach(name => {
      const btn = document.createElement('button');
      btn.className = 'member-pill' + (name === currentMember ? ' active' : '');

      const isMe = name === myName;
      let html = esc(name);
      if(isMe) html += ' <span class="me-badge">나</span>';
      if(editMode) html += ' <span class="delete-member">×</span>';
      btn.innerHTML = html;

      if(editMode){
        btn.ondblclick = (e) => { e.stopPropagation(); renameMember(name); };
        btn.title = '클릭: 탭 전환 / 더블클릭: 이름변경 / × 클릭: 삭제';
        const delBtn = btn.querySelector('.delete-member');
        delBtn.onclick = (e) => {
          e.stopPropagation();
          deleteMember(name);
        };
      }

      btn.addEventListener('click', (e) => {
        if(!e.target.classList.contains('delete-member')) {
          currentMember = name;
          render();
        }
      });
      wrap.appendChild(btn);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'add-member';
    addBtn.textContent = '+ 멤버';
    addBtn.onclick = addMember;
    wrap.appendChild(addBtn);
  }

  function renderReadonlyNote(){
    const el = document.getElementById('readonlyNote');
    el.innerHTML = '';
    if(canCheck() || !currentMember) return;
    const note = document.createElement('div');
    note.className = 'readonly-note';
    if(myName){
      note.innerHTML = `${esc(currentMember)}님의 기록은 보기 전용이에요.<button type="button" id="goMeBtn">내 체크로 돌아가기</button>`;
    } else {
      note.innerHTML = `체크하려면 먼저 이름을 골라주세요.<button type="button" id="pickNowBtn">이름 고르기</button>`;
    }
    el.appendChild(note);
    const goMe = document.getElementById('goMeBtn');
    if(goMe) goMe.onclick = () => { currentMember = myName; render(); };
    const pickNow = document.getElementById('pickNowBtn');
    if(pickNow) pickNow.onclick = openPicker;
  }

  function renderItems(){
    document.getElementById('currentMemberLabel').textContent = currentMember || '';
    const list = items[currentMember] || [];
    const container = document.getElementById('itemList');
    container.innerHTML = '';
    const allowed = canCheck();

    if(!list.length){
      container.innerHTML = '<div class="empty-state">아직 등록된 항목이 없어. 편집 버튼을 눌러 첫 항목을 추가해봐.</div>';
    }

    list.forEach(it => {
      const card = document.createElement('div');
      card.className = 'item-card';

      const done = completion(it.id);
      const pct = Math.round((done/7)*100);

      card.innerHTML = `
        <div class="dawn-bar"><div class="dawn-fill" style="width:${pct}%"></div></div>
        <div class="item-top">
          <div>
            <div class="item-name" ${editMode ? 'contenteditable="true"' : ''} data-field="name" data-id="${esc(it.id)}">${esc(it.name)}</div>
            <div class="item-goal" ${editMode ? 'contenteditable="true"' : ''} data-field="goal" data-id="${esc(it.id)}">${esc(it.goal || '')}</div>
          </div>
          <div class="item-meta">
            <span class="streak">${done}/7</span>
            ${editMode ? `<button class="delete-item" data-del="${esc(it.id)}">×</button>` : ''}
          </div>
        </div>
        <div class="days-row" data-days-for="${esc(it.id)}"></div>
      `;
      container.appendChild(card);

      const daysRow = card.querySelector('[data-days-for]');
      const c = getItemChecks(it.id);
      DAYS.forEach((d, idx) => {
        const cell = document.createElement('div');
        cell.className = 'day-cell';
        const future = isFutureDay(idx);
        cell.innerHTML = `
          <span class="day-label">${d.label}</span>
          <div class="day-check ${c[d.key] ? 'checked' : ''} ${future ? 'future' : ''} ${(!allowed && !future) ? 'locked' : ''}">${CHECK_ICON}</div>
        `;
        const box = cell.querySelector('.day-check');
        if(!future && allowed){
          box.onclick = () => toggleDay(it.id, d.key);
        }
        daysRow.appendChild(cell);
      });

      card.querySelectorAll('[contenteditable="true"]').forEach(el => {
        el.onblur = () => editItemField(el.dataset.id, el.dataset.field, el.textContent.trim());
        el.onkeydown = (e) => { if(e.key === 'Enter') { e.preventDefault(); el.blur(); } };
      });
      const delBtn = card.querySelector('[data-del]');
      if(delBtn) delBtn.onclick = () => deleteItem(delBtn.dataset.del);
    });

    if(editMode){
      const row = document.createElement('div');
      row.className = 'add-item-row';
      row.innerHTML = `
        <input type="text" placeholder="새 항목 (예: 침묵 기도)" id="newItemName">
        <input type="text" placeholder="목표 (선택)" id="newItemGoal">
        <button id="addItemBtn">추가</button>
      `;
      container.appendChild(row);
      document.getElementById('addItemBtn').onclick = () => {
        const nameEl = document.getElementById('newItemName');
        const goalEl = document.getElementById('newItemGoal');
        if(!nameEl.value.trim()) return;
        addItem(nameEl.value.trim(), goalEl.value.trim());
      };
    }
  }

  function renderOverview(){
    const body = document.getElementById('overviewBody');
    body.innerHTML = '';

    const rows = members.map(name => ({ name, pct: weekPct(name, checks) }));

    rows.forEach(r => {
      const pct = r.pct === null ? 0 : r.pct;
      const tier = tierOf(pct);
      const streak = streakWeeks(r.name);
      const isMe = r.name === myName;

      const row = document.createElement('div');
      row.className = 'ov-row ' + tier.cls + (isMe ? ' me' : '');
      row.innerHTML = `
        <div class="ov-name-wrap">
          <div class="ov-name">${esc(r.name)}${isMe ? ' <span class="me-badge">나</span>' : ''}</div>
          <div class="ov-tag">${tier.label}</div>
          ${streak >= 2 ? `<div class="ov-streak">🔥 ${streak}주 연속</div>` : ''}
        </div>
        <div class="ov-bar-wrap"><div class="dawn-bar"><div class="dawn-fill" style="width:${pct}%"></div></div></div>
        <div class="ov-pct">${pct}%</div>
      `;
      body.appendChild(row);
    });

    // 내 등급이 올라가면 축하 메시지
    if(myName){
      const mine = rows.find(r => r.name === myName);
      if(mine && mine.pct !== null){
        const rank = tierRank(mine.pct);
        const wk = weekKey();
        if(prevMyWeek === wk && prevMyTier !== null && rank > prevMyTier){
          showToast(TIER_TOASTS[rank]);
        }
        prevMyWeek = wk;
        prevMyTier = rank;
      }
    }
  }

  function render(){
    document.getElementById('weekLabel').textContent = weekLabelText();
    document.getElementById('todayBtn').classList.toggle('is-current', weekOffset === 0);

    const toggleBtn = document.getElementById('editToggle');
    toggleBtn.classList.toggle('on', editMode);
    toggleBtn.textContent = editMode ? '편집 완료' : '편집';

    const switchBtn = document.getElementById('switchUserBtn');
    switchBtn.textContent = myName ? ('나: ' + myName + ' · 변경') : '이름 고르기';

    renderTabs();
    renderReadonlyNote();
    renderItems();
    renderOverview();
    renderPicker();
  }

  function changeWeek(delta){
    weekOffset += delta;
    updateWeekListener();
  }

  document.getElementById('prevWeek').onclick = () => changeWeek(-1);
  document.getElementById('nextWeek').onclick = () => changeWeek(1);
  document.getElementById('todayBtn').onclick = () => { weekOffset = 0; updateWeekListener(); };
  document.getElementById('editToggle').onclick = () => { editMode = !editMode; render(); };
  document.getElementById('switchUserBtn').onclick = openPicker;
  document.getElementById('pickerSkip').onclick = () => { pickerSkipped = true; render(); };

  document.getElementById('refreshBtn').onclick = () => {
    if(confirm('서버의 모든 데이터를 공장초기화 할까요?\n(주의: 다른 사람의 기록도 함께 지워집니다)')){
      db.ref().remove().then(() => location.reload());
    }
  };

  (function init(){
    initFirebaseSync();
  })();
})();
</script>
</body>
</html>
